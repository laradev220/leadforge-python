[project]
name = "leadforge"
version = "1.0.0"
description = "Queue-driven enrichment pipeline for discovering, enriching, scoring, and exporting business leads"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.uv.workspace]
members = [
    "apps/api",
    "workers/discovery_worker",
    "workers/website_worker",
    "workers/contact_worker",
    "workers/social_worker",
    "workers/scoring_worker",
    "workers/export_worker",
    "packages/config",
    "packages/shared",
    "packages/database",
    "packages/worker_core",
    "packages/scraper_core",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "freezegun>=1.5",
]

[tool.uv.sources]
leadforge-config = { workspace = true }
leadforge-shared = { workspace = true }
leadforge-database = { workspace = true }
leadforge-worker-core = { workspace = true }
leadforge-scraper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: integration tests requiring real services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "C4", "DTZ", "PT", "RET", "SIM", "TID", "ARG", "PL", "RUF"]
ignore = [
    "S101",     # assert used in tests
    "S104",     # possible binding to all interfaces
    "S110",     # try-except-pass (intentional for resilience)
    "S112",     # try-except-continue
    "S311",     # random used for non-crypto
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR2004",  # magic values
    "PLC0415",  # local imports (intentional for circular dep avoidance)
    "PLW0603",  # global statement
    "PLW2901",  # redefined loop variable
    "ARG001",   # unused function argument (api contracts)
    "ARG002",   # unused method argument (api contracts)
    "ARG003",   # unused class attribute argument
    "ASYNC109", # async timeout
    "ASYNC230", # async file operations
    "ASYNC240", # async database operations
    "ASYNC250", # async redis operations
    "DTZ003",   # datetime without timezone
    "E501",     # line too long
    "B904",     # raise without from in except
    "SIM102",   # collapsible if
    "SIM117",   # multiple with statements
    "RUF002",   # ambiguous unicode character
    "RUF003",   # ambiguous unicode character in comment
    "RUF012",   # mutable class attribute
    "RUF060",   # invalid function override
    "F811",     # redefined name from outer scope
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PLR2004", "ARG", "N802", "N803"]
"alembic/*" = ["E", "F"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
