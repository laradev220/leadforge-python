[project]
name = "leadforge-config"
version = "1.0.0"
description = "Environment configuration via pydantic-settings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
