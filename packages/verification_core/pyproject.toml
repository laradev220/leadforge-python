[project]
name = "leadforge-verification"
version = "1.0.0"
description = "Email MX/SMTP and phone line-type verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dnspython>=2.6",
    "phonenumbers>=8.13",
    "leadforge-config",
    "leadforge-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_verification"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
