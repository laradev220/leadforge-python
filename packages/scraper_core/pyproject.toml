[project]
name = "leadforge-scraper-core"
version = "1.0.0"
description = "HTTP client, Playwright wrapper, per-source scraper modules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.4.10,<2",
    "beautifulsoup4>=4.12",
    "playwright>=1.47",
    "playwright-stealth>=1.0.0",
    "tenacity>=9.0",
    "prometheus-client>=0.21",
    "PyYAML>=6.0",
    "redis>=5.0",
    "lxml>=5.0",
    "websockets>=12.0",
    "leadforge-shared",
    "leadforge-config",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_scraper_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
