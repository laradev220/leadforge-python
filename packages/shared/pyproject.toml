[project]
name = "leadforge-shared"
version = "1.0.0"
description = "Shared types, constants, utils, and scoring engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "phonenumbers>=8.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
