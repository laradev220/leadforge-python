[project]
name = "api"
version = "1.0.0"
description = "LeadForge FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic[email]>=2.8",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "prometheus-client>=0.21",
    "leadforge-config",
    "leadforge-database",
    "leadforge-shared",
    "leadforge-worker-core",
    "leadforge-scraper-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_api"]

[tool.hatch.build.targets.wheel.shared-data]
"src/leadforge_api/py.typed" = "py.typed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
