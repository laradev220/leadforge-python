[project]
name = "website-worker"
version = "1.0.0"
description = "Website analysis worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26",
    "leadforge-config",
    "leadforge-database",
    "leadforge-shared",
    "leadforge-worker-core",
    "leadforge-scraper-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_website_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
