[project]
name = "scheduler-worker"
version = "1.0.0"
description = "Executes recurring search schedules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26",
    "leadforge-config",
    "leadforge-database",
    "leadforge-shared",
    "leadforge-worker-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_scheduler_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
