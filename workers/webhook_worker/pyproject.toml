[project]
name = "webhook-worker"
version = "1.0.0"
description = "Delivers signed webhook events with retries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "leadforge-config",
    "leadforge-database",
    "leadforge-shared",
    "leadforge-worker-core",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge_webhook_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
